<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>My Calendar Premium</title>
<style>
:root{--bg:#f8fafc;--text:#18181b;--card:#fff;--muted:#71717a;--line:#e5e7eb;--hover:#f1f5f9;--blue:#3b82f6;--green:#10b981;--red:#f43f5e;--yellow:#facc15;--orange:#f97316}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--bg:#09090b;--text:#fff;--card:#18181b;--muted:#a1a1aa;--line:#27272a;--hover:#27272a}
button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{min-height:100vh;background:var(--bg);overflow:hidden;transition:background .4s,color .4s}.main{max-width:768px;margin:auto;padding:16px;transition:transform .45s ease}.main.shift{transform:translateX(256px)}
.header{display:flex;justify-content:space-between;align-items:center;padding-top:4px;margin-bottom:30px}.headerLeft{display:flex;align-items:center;gap:12px}.menu,.today,.titleBox,.navBtn{background:var(--card);box-shadow:0 4px 18px #0000000b}.menu{width:48px;height:48px;border-radius:16px;font-size:25px}.titleBox{padding:12px 20px;border-radius:16px;font-size:22px;font-weight:800}.today{padding:13px 17px;border-radius:16px;font-weight:700;background:var(--hover)}
.monthHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.monthButton{background:none;font-size:31px;font-weight:900;letter-spacing:-1.2px}.monthButton:hover{color:var(--blue)}.nav{display:flex;gap:8px}.navBtn{width:44px;height:44px;border-radius:13px;font-size:31px;line-height:1}.navBtn:active,.menu:active,.today:active,.day:active,.action:active{transform:scale(.94)}
.calendarCard{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 20px 50px #0000000a}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week{gap:5px;margin-bottom:8px}.week div{text-align:center;color:#9ca3af;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.week div:first-child{color:#ef4444}.days{gap:7px}.blank{aspect-ratio:1}.day{position:relative;aspect-ratio:1;min-width:0;border:2px solid transparent;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;padding:8px 3px;overflow:hidden;transition:.18s}.day:hover{background:var(--hover)}.day.tick{background:#10b9811c;border-color:#10b98166}.day.cross{background:#f43f5e1c;border-color:#f43f5e66}.day.note{background:#3b82f61c;border-color:#3b82f666}.day.today{border-color:#facc15}.num{font-size:15px;font-weight:800;z-index:2}.day.sunday:not(.tick):not(.cross):not(.note) .num{color:#ef4444}.day.today .num{color:#ca8a04}.status{margin-top:auto;padding-bottom:3px;font-size:24px;font-weight:900;line-height:1;z-index:2}.tick .status{color:var(--green)}.cross .status{color:var(--red)}.note .status{color:var(--blue)}.alarmDot{position:absolute;top:5px;left:6px;color:var(--orange);font-size:11px}.noteDot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--blue)}.todayGlow{position:absolute;inset:0;background:linear-gradient(135deg,#facc1518,#f59e0b0d);pointer-events:none}
.stats{margin-top:30px;padding:24px;border-radius:28px;background:linear-gradient(135deg,var(--card),var(--hover));box-shadow:0 18px 45px #0000000c;display:flex;align-items:center;justify-content:space-between;gap:24px}.statRow{display:flex;align-items:center;gap:30px}.stat{text-align:left}.label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.value{font-size:39px;font-weight:950}.green{color:var(--green)}.divider{width:1px;height:50px;background:var(--line)}.export{padding:15px 22px;border-radius:16px;background:#18181b;color:#fff;font-weight:800}.dark .export{background:#fff;color:#18181b}.export:active{transform:scale(.97)}
.overlay{position:fixed;inset:0;background:#0006;backdrop-filter:blur(5px);opacity:0;pointer-events:none;z-index:40;transition:.3s}.overlay.show{opacity:1;pointer-events:auto}.sidebar{position:fixed;left:0;top:0;bottom:0;width:320px;padding:32px;background:var(--bg);border-right:1px solid var(--line);z-index:50;transform:translateX(-100%);transition:.45s;box-shadow:20px 0 50px #0002}.sidebar.show{transform:none}.sideHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}.sideHead h2{margin:0;font-size:28px}.close{width:40px;height:40px;border-radius:50%;background:var(--hover);font-size:25px}.appearance{display:flex;justify-content:space-between;align-items:center;padding:15px;border-radius:18px;background:var(--card);font-weight:750}.switch{width:58px;height:32px;border-radius:20px;background:#d1d5db;padding:3px}.switch.on{background:var(--blue)}.knob{width:26px;height:26px;border-radius:50%;background:white;display:grid;place-items:center;transition:.25s;box-shadow:0 2px 5px #0002}.switch.on .knob{transform:translateX(24px)}
.modalWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:.3s}.modalWrap.show{opacity:1;visibility:visible}.modalBg{position:absolute;inset:0;background:#0005;backdrop-filter:blur(10px)}.modal{position:relative;width:100%;max-width:440px;padding:28px;border-radius:32px;background:#fffffff5;color:var(--text);box-shadow:0 30px 80px #0004;border:1px solid var(--line);transform:translateY(55px) scale(.96);transition:.35s}.dark .modal{background:#18181bf5}.modalWrap.show .modal{transform:none}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.modalHead h3{margin:0;font-size:24px}.field{margin-bottom:19px}.field label{display:block;margin-bottom:8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.field input,.field textarea{width:100%;border:0;outline:0;background:var(--hover);color:var(--text);border-radius:16px;padding:15px}.field input[type=number]{font-size:20px;font-weight:800}.timeRow{display:flex;gap:8px;align-items:center;background:var(--hover);padding:7px;border-radius:16px}.timeRow input{background:transparent;padding:9px}.alarm{padding:11px 14px;border-radius:12px;background:#e5e7eb;color:#6b7280;font-weight:800}.alarm.on{background:var(--orange);color:#fff}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}.action{height:60px;border-radius:16px;font-size:29px;font-weight:900}.action.tick{background:#10b98118;color:#059669}.action.cross{background:#f43f5e18;color:#e11d48}.action.note{background:#3b82f618;color:#2563eb}.action.tick:hover{background:var(--green);color:white}.action.cross:hover{background:var(--red);color:white}.action.note:hover{background:var(--blue);color:white}.clear{width:100%;margin-top:13px;padding:15px;border-radius:16px;background:var(--hover);color:#f43f5e;font-weight:800}
.toast{position:fixed;top:16px;left:50%;z-index:100;min-width:280px;max-width:calc(100% - 32px);transform:translate(-50%,-90px);opacity:0;background:#059669;color:#fff;padding:15px 18px;border-radius:18px;box-shadow:0 15px 40px #0003;display:flex;align-items:center;gap:12px;transition:.4s}.toast.show{transform:translate(-50%,0);opacity:1}.toast b{display:block}.toast small{color:#d1fae5}.toastClose{margin-left:auto;background:none;color:#fff;font-size:20px}
.year{position:fixed;inset:0;z-index:100;background:var(--bg);transform:translateY(100%);transition:.5s;overflow:auto;padding:16px}.year.show{transform:none}.yearInner{max-width:1000px;margin:auto}.yearHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.yearHead h2{margin:0;font-size:42px}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}.miniMonth{padding:18px;border-radius:24px;background:var(--card);box-shadow:0 15px 35px #0000000a;text-align:left;cursor:pointer;transition:.2s}.miniMonth:hover{transform:scale(1.02)}.miniMonth h4{margin:0 0 12px;font-size:18px}.miniMonth.current h4{color:var(--blue)}.miniWeek,.miniDays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.miniWeek span{text-align:center;color:#9ca3af;font-size:9px;font-weight:800}.miniDays span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:10px;color:var(--muted)}.miniDays .t{background:#facc15;color:#000;font-weight:900}.miniDays .g{background:#10b981;color:#fff}.miniDays .r{background:#f43f5e;color:#fff}.miniDays .b{background:#3b82f6;color:#fff}
@media(max-width:640px){.main{padding:12px}.titleBox{font-size:19px;padding:12px 15px}.today{padding:12px 14px}.monthButton{font-size:27px}.calendarCard{padding:13px;border-radius:24px}.days{gap:4px}.day{border-radius:12px;padding:7px 2px}.num{font-size:14px}.status{font-size:20px}.stats{flex-direction:column;align-items:stretch;padding:20px 16px}.statRow{justify-content:space-around}.stat{text-align:center}.export{width:100%}.months{grid-template-columns:repeat(2,1fr);gap:15px}.yearHead h2{font-size:34px}.sidebar{width:280px}}
@media(max-width:390px){.headerLeft{gap:7px}.menu{width:44px;height:44px}.titleBox{font-size:17px}.today{font-size:13px}.week{gap:2px}.days{gap:3px}.day{border-radius:9px}.num{font-size:13px}}
</style>
</head>
<body>
<div class="app" id="app">
<main class="main" id="main">
<header class="header"><div class="headerLeft"><button class="menu" id="menuBtn">☰</button><div class="titleBox">Calendar</div></div><button class="today" id="todayBtn">Today</button></header>
<div class="monthHead"><button class="monthButton" id="yearOpenBtn"><span id="monthTitle"></span> <span style="font-size:22px;color:#9ca3af">▣</span></button><div class="nav"><button class="navBtn" id="prevBtn">‹</button><button class="navBtn" id="nextBtn">›</button></div></div>
<section class="calendarCard"><div class="week" id="week"></div><div class="days" id="days"></div></section>
<section class="stats"><div class="statRow"><div class="stat"><div class="label">Ticked Days</div><div class="value green" id="totalDays">0</div></div><div class="divider"></div><div class="stat"><div class="label">Amount</div><div class="value"><span style="font-size:20px;color:var(--muted)">₹</span><span id="totalAmount">0</span></div></div></div><button class="export" id="exportBtn">⇩ &nbsp; Export Data</button></section>
</main>
<div class="overlay" id="sideOverlay"></div>
<aside class="sidebar" id="sidebar"><div class="sideHead"><h2>Settings</h2><button class="close" id="sideClose">×</button></div><div class="appearance"><span>Appearance</span><button class="switch" id="themeSwitch"><span class="knob" id="themeKnob">☀</span></button></div></aside>
<div class="modalWrap" id="modalWrap"><div class="modalBg" id="modalBg"></div><div class="modal"><div class="modalHead"><h3 id="modalDate"></h3><button class="close" id="modalClose">×</button></div><div class="field"><label>Amount (₹)</label><input type="number" id="amount" value="60"></div><div class="field"><label>Reminder Time</label><div class="timeRow"><input type="time" id="time"><button class="alarm" id="alarmBtn">♧ Off</button></div></div><div class="field"><label>Note</label><textarea id="note" rows="3" placeholder="Write a note..."></textarea></div><div class="actions"><button class="action tick" data-status="tick">✓</button><button class="action cross" data-status="cross">×</button><button class="action note" data-status="note">▤</button></div><button class="clear" id="clearBtn">Clear Entry</button></div></div>
<div class="toast" id="toast"><span style="font-size:22px">♧</span><div><b id="toastTitle">Reminder</b><small id="toastMsg"></small></div><button class="toastClose" id="toastClose">×</button></div>
<section class="year" id="yearView"><div class="yearInner"><div class="yearHead"><h2 id="yearTitle"></h2><button class="close" id="yearClose">×</button></div><div class="months" id="months"></div></div></section>
</div>
<script>
(function(){
'use strict';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], SHORTD=['S','M','T','W','T','F','S'];
var currentDate=new Date(), marks={}, theme='light', selectedDateKey=null, modalData={amount:60,note:'',time:'',alarmEnabled:false}, toastTimer=null;
try{marks=JSON.parse(localStorage.getItem('premiumCalData')||'{}')}catch(e){marks={}}
theme=localStorage.getItem('premiumCalTheme')||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
function $(id){return document.getElementById(id)}
function keyFor(y,m,d){return y+'-'+(m+1)+'-'+d}
function todayKey(){var d=new Date();return keyFor(d.getFullYear(),d.getMonth(),d.getDate())}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function firstDay(y,m){return new Date(y,m,1).getDay()}
function save(){localStorage.setItem('premiumCalData',JSON.stringify(marks))}
function applyTheme(){document.body.classList.toggle('dark',theme==='dark');$('themeSwitch').classList.toggle('on',theme==='dark');$('themeKnob').textContent=theme==='dark'?'☾':'☀';localStorage.setItem('premiumCalTheme',theme);var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='dark'?'#09090b':'#f8fafc'}
function render(){
 var y=currentDate.getFullYear(),m=currentDate.getMonth(),html='',i,d,k,r,cls,status;
 $('monthTitle').textContent=MONTHS[m]+' '+y;
 $('week').innerHTML=DAYS.map(function(x,i){return '<div>'+((window.innerWidth<640)?SHORTD[i]:x)+'</div>'}).join('');
 for(i=0;i<firstDay(y,m);i++)html+='<div class="blank"></div>';
 for(d=1;d<=daysInMonth(y,m);d++){
  k=keyFor(y,m,d);r=marks[k];cls='day';if(r)cls+=' '+r.status;if(k===todayKey())cls+=' today';if(new Date(y,m,d).getDay()===0)cls+=' sunday';status=r?(r.status==='tick'?'✓':r.status==='cross'?'×':'▤'):'';
  html+='<button class="'+cls+'" data-day="'+d+'"><span class="num">'+d+'</span>'+(r&&r.alarmEnabled?'<span class="alarmDot">♧</span>':'')+(r&&r.note&&r.status!=='note'?'<span class="noteDot"></span>':'')+'<span class="status">'+status+'</span>'+(k===todayKey()?'<span class="todayGlow"></span>':'')+'</button>';
 }
 $('days').innerHTML=html;
 Array.prototype.forEach.call(document.querySelectorAll('.day'),function(btn){btn.onclick=function(){openModal(Number(btn.getAttribute('data-day')))}});
 var td=0,ta=0;Object.keys(marks).forEach(function(key){var p=key.split('-');if(Number(p[0])===y&&Number(p[1])===m+1&&marks[key].status==='tick'){td++;ta+=Number(marks[key].amount)||0}});$('totalDays').textContent=td;$('totalAmount').textContent=ta;
}
function openModal(day){var y=currentDate.getFullYear(),m=currentDate.getMonth(),k=keyFor(y,m,day),r=marks[k]||{};selectedDateKey=k;modalData={amount:r.amount||60,note:r.note||'',time:r.time||'',alarmEnabled:!!r.alarmEnabled};$('modalDate').textContent=new Date(y,m,day).toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});$('amount').value=modalData.amount;$('note').value=modalData.note;$('time').value=modalData.time;updateAlarm();$('clearBtn').style.display=marks[k]?'block':'none';$('modalWrap').classList.add('show')}
function closeModal(){$('modalWrap').classList.remove('show');selectedDateKey=null}
function updateAlarm(){$('alarmBtn').className='alarm'+(modalData.alarmEnabled?' on':'');$('alarmBtn').textContent=modalData.alarmEnabled?'♧ On':'♧ Off'}
function saveEntry(status){marks[selectedDateKey]={status:status,amount:status==='tick'?(Number($('amount').value)||0):0,note:$('note').value,time:$('time').value,alarmEnabled:modalData.alarmEnabled};save();closeModal();render()}
function clearEntry(){if(selectedDateKey){delete marks[selectedDateKey];save()}closeModal();render()}
function showToast(title,msg){$('toastTitle').textContent=title;$('toastMsg').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,5000)}
function hideToast(){$('toast').classList.remove('show')}
function renderYear(){var y=currentDate.getFullYear(),out='';$('yearTitle').textContent=y;SHORT.forEach(function(name,m){var s='<button class="miniMonth '+(m===new Date().getMonth()&&y===new Date().getFullYear()?'current':'')+'" data-month="'+m+'"><h4>'+name+'</h4><div class="miniWeek">';SHORTD.forEach(function(x){s+='<span>'+x+'</span>'});s+='</div><div class="miniDays">';for(var i=0;i<firstDay(y,m);i++)s+='<span></span>';for(var d=1;d<=daysInMonth(y,m);d++){var k=keyFor(y,m,d),r=marks[k],c=k===todayKey()?'t':r&&r.status==='tick'?'g':r&&r.status==='cross'?'r':r&&r.status==='note'?'b':'';s+='<span class="'+c+'">'+(r?'':d)+'</span>'}s+='</div></button>';out+=s});$('months').innerHTML=out;Array.prototype.forEach.call(document.querySelectorAll('.miniMonth'),function(b){b.onclick=function(){currentDate=new Date(y,Number(b.getAttribute('data-month')),1);$('yearView').classList.remove('show');render()}})}
$('prevBtn').onclick=function(){currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()-1,1);render()};$('nextBtn').onclick=function(){currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+1,1);render()};$('todayBtn').onclick=function(){currentDate=new Date();render()};$('yearOpenBtn').onclick=function(){renderYear();$('yearView').classList.add('show')};$('yearClose').onclick=function(){$('yearView').classList.remove('show')};
$('menuBtn').onclick=function(){$('sidebar').classList.add('show');$('sideOverlay').classList.add('show');$('main').classList.add('shift')};function closeSide(){$('sidebar').classList.remove('show');$('sideOverlay').classList.remove('show');$('main').classList.remove('shift')}$('sideClose').onclick=closeSide;$('sideOverlay').onclick=closeSide;
$('themeSwitch').onclick=function(){theme=theme==='dark'?'light':'dark';applyTheme()};$('modalClose').onclick=closeModal;$('modalBg').onclick=closeModal;$('amount').oninput=function(){modalData.amount=this.value};$('note').oninput=function(){modalData.note=this.value};$('time').oninput=function(){modalData.time=this.value};$('alarmBtn').onclick=function(){modalData.alarmEnabled=!modalData.alarmEnabled;updateAlarm()};
Array.prototype.forEach.call(document.querySelectorAll('.action'),function(b){b.onclick=function(){saveEntry(b.getAttribute('data-status'))}});$('clearBtn').onclick=clearEntry;$('toastClose').onclick=hideToast;
$('exportBtn').onclick=function(){var csv='Date,Status,Amount,Time,Alarm,Note\n';Object.keys(marks).sort().forEach(function(date){var r=marks[date];var note=(r.note||'').replace(/"/g,'""');csv+=date+','+r.status+','+r.amount+','+(r.time||'')+','+(r.alarmEnabled?'Yes':'No')+',"'+note+'"\n'});var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='My_Calendar_Premium.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};
setInterval(function(){var now=new Date(),k=todayKey(),t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),r=marks[k];if(r&&r.alarmEnabled&&r.time===t){showToast('Reminder',r.note||'You have an event right now!');r.alarmEnabled=false;save();render()}},30000);
applyTheme();render();
})();
</script>
</body>
</html>
